[tool.poetry]
name = "forlife-insurance-core"
version = "0.1.0"
description = "Pacote compartilhado de domínio, banco e modelos para o projeto Forlife"
authors = ["Rodrigo Silva <dataforge.br@gmail.com>"]
readme = "README.md"
packages = [{ include = "forlife_insurance_core", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
sqlalchemy = ">=2.0.49,<3.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
psycopg2-binary = ">=2.9.12,<3.0.0"

[tool.poetry.group.dev.dependencies]
black = ">=26.3.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
bandit = ">=1.9.4,<2.0.0"
pre-commit = ">=4.5.1,<5.0.0"
pytest = ">=8.0.0,<9.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
