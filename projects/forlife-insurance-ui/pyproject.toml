[tool.poetry]
name = "forlife-insurance-ui"
version = "0.1.0"
description = "Interface Streamlit para o portfólio ForLife Insurance"
authors = ["Rodrigo Silva <dataforge.br@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
streamlit = ">=1.35.0"
httpx = ">=0.27.0"
pandas = ">=2.2.0"
python-dotenv = ">=1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
