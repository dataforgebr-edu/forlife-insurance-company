[tool.poetry]
name = "forlife-insurance-company"
version = "0.1.0"
description = "Monorepo flat da plataforma Forlife Insurance"
authors = ["Rodrigo Silva <dataforge.br@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "forlife_insurance_core", from = "projects" },
    { include = "forlife_insurance_api",  from = "projects" },
    { include = "forlife_insurance_seed", from = "projects" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
sqlalchemy = ">=2.0.49,<3.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
psycopg2-binary = ">=2.9.12,<3.0.0"
fastapi = ">=0.115.12,<1.0.0"
uvicorn = ">=0.34.0,<1.0.0"
pydantic = ">=2.13.3,<3.0.0"
pydantic-extra-types = { version = ">=2.11.1,<3.0.0", extras = ["phonenumbers"] }
pydantic-br = ">=1.1.0,<2.0.0"
email-validator = "^2.3.0"
faker = ">=37.11.0,<38.0.0"
streamlit = ">=1.35.0"
httpx = ">=0.27.0"
pandas = ">=2.2.0"

[tool.poetry.group.dev.dependencies]
black = ">=24.3.0,<25.0.0"
isort = ">=5.13.2,<6.0.0"
bandit = ">=1.8.3,<2.0.0"
pre-commit = ">=3.7.0,<4.0.0"
pytest = ">=8.0.0,<9.0.0"
taskipy = ">=1.13.0,<2.0.0"

[tool.taskipy.tasks]
lint       = { cmd = "black projects && isort projects",                       help = "Formata código" }
lint-check = { cmd = "black --check projects && isort --check projects",       help = "Verifica formatação (CI)" }
security   = { cmd = "bandit -r projects -lll",                                help = "Scan de segurança" }
test       = { cmd = "pytest",                                                 help = "Roda testes" }
api        = { cmd = "uvicorn forlife_insurance_api.app:app --reload",         help = "Sobe a API" }
ui         = { cmd = "streamlit run projects/forlife_insurance_ui/app.py",     help = "Sobe o Streamlit" }
seed       = { cmd = "python projects/forlife_insurance_seed/runner.py --mode once --batch-size 5",              help = "Seed do banco" }

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["projects"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
