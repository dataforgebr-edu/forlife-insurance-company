[tool.poetry]
name = "forlife-insurance-workspace"
version = "0.1.0"
description = "Workspace dos projetos Forlife Insurance"
authors = ["Rodrigo Silva <dataforge.br@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.workspace]
members = [
    "projects/forlife-insurance-api",
    "projects/forlife-insurance-core",
    "projects/forlife-insurance-extract",
    "projects/forlife-insurance-seed"
]

[tool.poetry.dependencies]
python = ">=3.14,<4.0"

[tool.poetry.group.dev.dependencies]
black = ">=26.3.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
bandit = ">=1.9.4,<2.0.0"
pre-commit = ">=4.5.1,<5.0.0"
pytest = ">=8.0.0,<9.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
