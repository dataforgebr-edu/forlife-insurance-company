[tool.poetry]
name = "forlife-insurance-workspace"
version = "0.1.0"
description = "Workspace dos projetos Forlife Insurance"
authors = ["Rodrigo Silva <dataforge.br@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

[tool.poetry.group.dev.dependencies]
black = ">=24.3.0,<25.0.0"
isort = ">=5.13.2,<6.0.0"
bandit = ">=1.8.3,<2.0.0"
pre-commit = ">=3.7.0,<4.0.0"
pytest = ">=8.0.0,<9.0.0"
taskipy = ">=1.13.0,<2.0.0"

[tool.taskipy.tasks]
install      = { cmd = "poetry install --directory projects/forlife-insurance-core && poetry install --directory projects/forlife-insurance-api && poetry install --directory projects/forlife-insurance-extract && poetry install --directory projects/forlife-insurance-seed", help = "Instala todos os sub-projetos" }
lint         = { cmd = "cd projects/forlife-insurance-core && poetry run black src && poetry run isort src && cd ../forlife-insurance-api && poetry run black src && poetry run isort src && cd ../forlife-insurance-extract && poetry run black src && poetry run isort src && cd ../forlife-insurance-seed && poetry run black src && poetry run isort src", help = "Formata o código com black e isort em todos os projetos" }
lint-check   = { cmd = "cd projects/forlife-insurance-core && poetry run black --check src && poetry run isort --check src && cd ../forlife-insurance-api && poetry run black --check src && poetry run isort --check src && cd ../forlife-insurance-extract && poetry run black --check src && poetry run isort --check src && cd ../forlife-insurance-seed && poetry run black --check src && poetry run isort --check src", help = "Verifica formatação sem alterar arquivos (útil em CI)" }
security     = { cmd = "cd projects/forlife-insurance-core && poetry run bandit -r src -lll && cd ../forlife-insurance-api && poetry run bandit -r src -lll && cd ../forlife-insurance-extract && poetry run bandit -r src -lll && cd ../forlife-insurance-seed && poetry run bandit -r src -lll", help = "Análise de segurança com bandit em todos os projetos" }
test         = { cmd = "cd projects/forlife-insurance-core && poetry run pytest && cd ../forlife-insurance-api && poetry run pytest && cd ../forlife-insurance-extract && poetry run pytest && cd ../forlife-insurance-seed && poetry run pytest", help = "Roda pytest em todos os projetos" }
all          = { cmd = "poetry run task install && poetry run task lint && poetry run task security && poetry run task test", help = "Executa install + lint + security + test" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
