[project]
name = "forlife-insurance-company"
version = "0.1.0"
description = "Projeto de dados para uma seguradora de vida, carros e automéveis"
authors = [
    {name = "Rodrigo Silva dataforge.br@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "faker (>=37.11.0,<38.0.0)",
    "psycopg2-binary (>=2.9.0,<3.0.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
