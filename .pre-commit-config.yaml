repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3  # Use the latest version from the Bandit GitHub repo
    hooks:
      - id: bandit
        args: ["-lll"]  # Optional: only show high-severity issues
